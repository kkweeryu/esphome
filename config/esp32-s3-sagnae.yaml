esphome:
  name: esp32-s3-sagnae
  friendly_name: esp32-s3-sagnae
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - lambda: |-
        ESP_LOGD("boot", "!!! on boot start");
    - light.turn_on:
        id: rgb_light
        red: 0%
        blue: 50%
        green: 0%
        brightness: 60%
        effect: pulse
    - delay: 30s
    - wifi.enable
    - wait_until:
        condition:
          wifi.connected:
    # - mqtt.enable
    # - wait_until:
    #     condition:
    #       mqtt.connected:
    - light.turn_on:
        id: rgb_light
        red: 0%
        blue: 0%
        green: 50%
        brightness: 60%
        effect: pulse
    - delay: 6s
    - light.turn_off:
        id: rgb_light

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    # type: arduino
    # version: latest

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  level: DEBUG
  baud_rate: 115200
  # hardware_uart: UART0

# Enable Home Assistant API
api:
  encryption:
    key: "BoCCG/J+KiX8AMqrGllPk1DXbUHgR/Ivbj5+w9ZZiII="
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "3c880661dff52b78ff97eff88686cd58"

wifi:
  ssid: !secret wifi_ssid_office
  password: !secret wifi_password_office
  fast_connect: true
  enable_on_boot: false

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-S3 Fallback Hotspot"
    password: "rpahbed6"

  # Optional manual IP
  manual_ip:
    static_ip: 192.168.0.16
    gateway: 192.168.0.1
    subnet: 255.255.255.0

captive_portal:

web_server:
  port: 80

mqtt:
  broker: 192.168.0.21
  port: 1883
  log_topic: null
  enable_on_boot: false
  on_json_message:
    topic: zigbee2mqtt-july/office_desk_3
    then:
      - lambda: |-
          if (x.containsKey("state")) {
            std::string state = x["state"];
            if(state == "ON") {
              id(zigbee_office_switch).publish_state(true);
            } else if(state == "OFF") {
              id(zigbee_office_switch).publish_state(false);
            }
          }

substitutions:
  dev_name: Sagnae S3
  id_name: sagnae_s3

external_components:
  - source: ./external_components

light:
  # - platform: status_led
  #   name: ${dev_name} Light
  #   pin: GPIO48
  - platform: esp32_rmt_led_strip
    id: rgb_light
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    # rmt_channel: 0
    chipset: ws2812
    name: "RGB Light"
    effects:
      - pulse:
          transition_length: 550ms
          update_interval: 550ms
      - flicker:
      - addressable_fireworks:
          use_random_color: true
      - addressable_rainbow:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT
    #      inverted: true  # 필요에 따라 논리를 반전시킵니다.
    name: ${dev_name} boot input
  - platform: status
    name: ${dev_name} Status

sensor:
  - platform: wifi_signal
    name: ${dev_name} wifi signal
    id: ${id_name}_wifi_signal
    update_interval: 60s
  - platform: internal_temperature
    name: "ESP32 S3 temperature"
    id: "esp32_s3_temp"
  - platform: homeassistant
    name: current temp
    id: current_temp
    entity_id: sensor.hyeonjaeondo
    internal: false
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("weather", "updated temp : %f", x);
            if (abs(id(prev_temp) - x) >= 1.0) {
              id(pvvx_display_update).turn_on();
              id(prev_temp) = x;
            }
        # - switch.turn_on: pvvx_display_update
  - platform: homeassistant
    name: current humid
    id: current_humid
    entity_id: sensor.hyeonjaeseubdo
    internal: false
  - platform: homeassistant
    name: rain percent
    id: rain_percent
    entity_id: sensor.gangsuhwagryul
    internal: false

switch:
  - platform: restart
    name: ${dev_name} restart
  - platform: safe_mode
    name: ${dev_name} Restart Safemode
  - platform: sagnae
    test:
      name: test switch
  - platform: template
    name: zigbee office switch
    id: zigbee_office_switch
    optimistic: true
    turn_on_action:
      - mqtt.publish:
          topic: "zigbee2mqtt-july/office_desk_3/set"
          payload: "ON"

    turn_off_action:
      - mqtt.publish:
          topic: "zigbee2mqtt-july/office_desk_3/set"
          payload: "OFF"
  - platform: template
    name: zigbee office switch 1
    id: zigbee_office_switch_1
    optimistic: true
    turn_on_action:
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.office_desk_3
    turn_off_action:
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.office_desk_3
  #blooth 수동 pairing 스위치
  - platform: ble_client
    ble_client_id: pvvx_ble_display
    name: PVVX_BLEPairing
    id: pvvx_blepairing
    #internal: true
    restore_mode: ALWAYS_OFF

  - platform: template
    name: PVVX Display update
    id: pvvx_display_update
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      then:
        - switch.turn_on: pvvx_blepairing

# time:
#   - platform: homeassistant
#     id: ${id_name}_time
#     timezone: Asia/Seoul

text_sensor:
  - platform: version
    name: "${dev_name} Version"
  - platform: wifi_info
    ip_address:
      name: "${dev_name} IP"
      icon: mdi:ip-outline
    mac_address:
      name: "${dev_name} MAC"
      icon: mdi:barcode-scan
    ssid:
      name: "${dev_name} SSID"
      icon: mdi:wifi-lock
    bssid:
      name: "${dev_name} BSSID"
      icon: mdi:router-wireless
  - platform: sagnae
    test:
      name: test text_sensor
  - platform: homeassistant
    name: current weather
    id: current_weather
    internal: false
    entity_id: sensor.hyeonjaenalssi
    filters:
      - substitute:
          - "맑음 -> sunny"
          - "흐림 -> cloud"
          - "비 -> rain"
          - "눈 -> snow"
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("weather", "updated weather : %s", x.c_str());
        - switch.turn_on: pvvx_display_update
sagnae:
  id: sagnae_id

# sagnae_test:
#   id: sagnae_test_id

button:
  - platform: sagnae
    test:
      name: test button

number:
  - platform: sagnae
    test:
      name: test number

select:
  - platform: sagnae
    test:
      name: test select
  - platform: template
    name: basic select
    id: test_select
    optimistic: true
    options:
      - "test 1"
      - "test 2"
      - "test 3"
    # initial_option: "test 3"
    on_value:
      then:
        - lambda: |-
            uint8_t index;
            if(x == "test 1"){
              ESP_LOGD("custom", "test 1 selected");
              index = 0;
            } else if(x == "test 2") {
              index = 1;
              ESP_LOGD("custom", "test 2 selected");
            } else {
              index = 2;
              ESP_LOGD("custom", "else selected");
            }
              id(sagnae_id).set_test_select(x, index);

esp32_ble_tracker:

ble_client:
  - mac_address: A4:C1:38:46:F7:E5
    id: pvvx_ble_display
    on_connect:
      then:
        - delay: 1s
        - if:
            condition:
              switch.is_on: pvvx_display_update
            then:
              - component.update: pvvx_display
              - switch.turn_off: pvvx_display_update
        - lambda: |-
            ESP_LOGD("weather", "current weather temp : %f", id(current_temp).state);

display:
  - platform: pvvx_mithermometer
    id: pvvx_display
    ble_client_id: pvvx_ble_display
    update_interval: 12h
    validity_period: 65535s
    lambda: |-
      float temp = id(current_temp).state;
      float humid = id(current_humid).state;
      float rain = id(rain_percent).state;
      std::string weather = id(current_weather).state;
      it.print_bignum(temp);
      it.print_unit(pvvx_mithermometer::UNIT_DEG_C);
      it.print_smallnum(rain);
      it.print_percent(true);
      if (weather == "rain") {
        it.print_sad(true);
      } else if (weather == "snow") {
        it.print_sad(true);
        it.print_happy(true);
      } else {
        it.print_happy(true);
      }
      it.print_bracket(true);
      it.print_battery(true);

globals:
  - id: prev_temp
    type: float
    restore_value: no
    initial_value: "0.0"

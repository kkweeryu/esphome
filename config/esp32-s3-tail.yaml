substitutions:
  device_name: "esp32-s3-tail"
  friendly_name: "S3 tail Example"

  esp32_platform: "ESP32S3"
  esp32_board: "esp32-s3-devkitc-1"
  esp32_flash_size: "16MB"

  esp32_wifi_enable_on_boot: "true"

  dev_name: "S3 Tail"
  id_name: "s3_tail"

packages:
  remote_base: !include esp32-base.yaml
  tailscale:
    url: https://github.com/Csontikka/esphome-tailscale
    ref: v0.5.2
    files:
      - packages/tailscale/tailscale.yaml
    refresh: 0s

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG # 로그 레벨을 DEBUG(또는 최고 수준인 VERY_VERBOSE)로 설정
  hardware_uart: USB_SERIAL_JTAG # idf
  # hardware_uart: USB_CDC # arduino
  baud_rate: 115200 # 통신 속도 설정 (기본값 115200)

# 로그 확인용 웹 인터페이스
web_server:
  port: 80

# external_components:
#   - source:
#       type: git
#       url: https://github.com/Csontikka/esphome-tailscale.git
#       ref: main
#     components: [tailscale]
#     refresh: 0s

tailscale:
  auth_key: tskey-auth-kevqDE8eqA11CNTRL-n7z9NoUJ376m6Uvzq1Ko76QSH1Azcn99
  hostname: esp23-s3-tail
  # accept_routes: true

api:
  reboot_timeout: 0s

light:
  # - platform: status_led
  #   name: ${dev_name} Light
  #   pin: GPIO48
  - platform: esp32_rmt_led_strip
    id: rgb_light
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    # rmt_channel: 0
    chipset: ws2812
    name: "RGB Light"
    effects:
      - pulse:
          transition_length: 550ms
          update_interval: 550ms
      - flicker:
      - addressable_fireworks:
          use_random_color: true
      - addressable_rainbow:

script:
  - id: run_on_boot
    mode: single
    then:
    - lambda: |-
        ESP_LOGD("boot", "!!! on boot start");
    - light.turn_on:
        id: rgb_light
        red: 0%
        blue: 50%
        green: 0%
        brightness: 60%
        effect: pulse
#    - delay: 30s
    # - wifi.enable
    - wait_until:
        condition:
          wifi.connected:
    - lambda: |-
        ESP_LOGD("boot", "!!! on boot wifi connected");
    # - mqtt.enable
    # - wait_until:
    #     condition:
    #       mqtt.connected:
    # - lambda: |-
    #     ESP_LOGD("boot", "!!! on boot mqtt connected");
    - light.turn_on:
        id: rgb_light
        red: 0%
        blue: 0%
        green: 50%
        brightness: 60%
        effect: pulse
    - delay: 3s
    - light.turn_off:
        id: rgb_light

mqtt:
  # broker: 192.168.0.21
  # broker: 100.117.65.103
  broker: 100.69.176.24
  port: 1883
  log_topic: null
  enable_on_boot: true
  # username: kkryu
  # password: rpahbed6

espnow:
  # peers:
  #   - 11:22:33:44:55:66
  auto_add_peer: true
  # 메시지를 받았을 때 실행할 자동화(트리거)
  on_receive:
    then:
      - lambda: |-
          char des_mac[MAC_ADDRESS_PRETTY_BUFFER_SIZE];
          char src_mac[MAC_ADDRESS_PRETTY_BUFFER_SIZE];
          char hex[256];
          ESP_LOGD("espnow", "Received from %s to %s: %s RSSI: %ddBm",
                 format_mac_addr_upper(info.src_addr, src_mac),
                 format_mac_addr_upper(info.des_addr, des_mac),
                 format_hex_pretty_to(hex, data, size),
                 info.rx_ctrl->rssi);

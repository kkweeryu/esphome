substitutions:
  device_name: "esp32-s3-ex"
  friendly_name: "S3 Example"

  esp32_platform: "ESP32S3"
  esp32_board: "esp32-s3-devkitc-1"
  esp32_flash_size: "16MB"

  esp32_wifi_enable_on_boot: "true"

  dev_name: "S3 Example"
  id_name: "s3_ex"

packages:
  remote_base: !include esp32-base.yaml

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG # 로그 레벨을 DEBUG(또는 최고 수준인 VERY_VERBOSE)로 설정
  hardware_uart: USB_SERIAL_JTAG # idf
  # hardware_uart: USB_CDC # arduino
  baud_rate: 115200 # 통신 속도 설정 (기본값 115200)

# 로그 확인용 웹 인터페이스
web_server:
  port: 80


# external_components:
